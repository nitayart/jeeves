// Project-key IT: a JEB project is identified by the key stored in its .jdb2, one project per key
// in a context. Old databases are keyed wb-t1, wb-t2 … per server run; the suite makes two under
// one key and checks the reported collision is gone, a clashing load is refused up front and no
// target is displaced (see src/test/java/dev/workbench/it/KeysIT.java). Hermetic home + port.
tasks.register('keysIT', JavaExec) {
    group = 'verification'
    description = 'Project-key IT: unique keys for new databases, recorded keys, clashing loads refused'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.workbench.it.KeysIT'
    workingDir = repoRoot
    def keysHome = new File(buildDir, 'tmp/keysit-home')
    doFirst { delete(keysHome); keysHome.mkdirs() }
    environment 'WORKBENCH_HOME', keysHome.absolutePath
    environment 'WORKBENCH_PORT', '7817'   // never collide with the interactive server on 7800
    systemProperty 'workbench.test.replayPauseMs', '400'   // room to close a target in the middle of its history replay
    environment 'WORKBENCH_MOCK', '0'
    dependsOn 'compileTestJava'
    if (hasEngine) {
        classpath += engineJars
        jvmArgs jebJvmArgs
    }
}

