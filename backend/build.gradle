// JVM flags JEB requires (SecurityManager opt-in, reflective access). Absolute paths: JavaExec workingDir is the repo root.
// Heap default 16g, matching workbench.sh: fresh GMS-class analysis peaks ~14.1g and
// an OOM mid-analysis can strand a .jdb2.lock (app-review-opus P1-2). WORKBENCH_XMX
// overrides (e.g. WORKBENCH_XMX=8g gradle m1IT for cached-jdb2 browsing tasks).
def workbenchXmx = System.getenv('WORKBENCH_XMX') ?: '16g'
// the JVM's temp dir for every gradle-run server and IT: under build/, never the system /tmp
// (nothing of the workbench's is kept there — 2026-09-15)
def jvmTmp = file("${buildDir}/tmp/jvm")
// Use the selected installation's normal JVM options, like the vendor launcher.
// This is whitespace tokenization, never shell evaluation. Jeeves options follow.
def installedJvmOptions = new File(engineDir, 'jvmopt.txt')
def installedJvmArgs = hasEngine && installedJvmOptions.isFile() && !installedJvmOptions.text.trim().isEmpty()
        ? installedJvmOptions.text.trim().split(/\s+/).toList() : []
def jebJvmArgs = installedJvmArgs + [
    '-Xms1g', "-Xmx${workbenchXmx}", '-XX:+UseG1GC', '-Djava.awt.headless=true',
    '-Djava.security.manager=allow', "-Djava.io.tmpdir=${jvmTmp}",
    '--add-opens', 'java.base/java.lang=ALL-UNNAMED',
    "-Dworkbench.jebHome=$engineDir",
]

tasks.withType(JavaExec).configureEach {
    if (System.getenv('JAVA_HOME')) executable = new File(System.getenv('JAVA_HOME'), 'bin/java').absolutePath
    doFirst { jvmTmp.mkdirs() }
    // the suites written before the review switch exercise the proposal QUEUE: they run under
    // manual review; m7IT owns the switch itself (default auto, then toggles)
    if (name.endsWith('IT') && name != 'm7IT') environment 'WORKBENCH_REVIEW_MODE', 'manual'
    if (name == 'keysIT' && System.getenv('WORKBENCH_QUALIFY_FIXTURE')) {
        args System.getenv('WORKBENCH_QUALIFY_FIXTURE')
    }
}

