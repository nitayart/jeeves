// Native rename fixtures: no HTTP server or model, fresh homes and databases on each run.
[
    onDemandSearchIT: ['dev.workbench.it.OnDemandSearchIT', 'rename-family/rename-family.dex'],
    nativeHistoryRecoveryIT: ['dev.workbench.it.NativeHistoryRecoveryIT', 'params/params-fixture.dex'],
    nativeSaveIT: ['dev.workbench.it.NativeSaveIT', 'params/params-fixture.dex'],
    nativeRecoveryIT: ['dev.workbench.it.NativeRecoveryIT', 'params/params-fixture.dex'],
    concurrentRenameIT: ['dev.workbench.it.ConcurrentRenameIT', 'params/params-fixture.dex'],
    renameCollisionIT: ['dev.workbench.it.RenameCollisionIT', 'params/params-fixture.dex'],
    localNameProvenanceIT: ['dev.workbench.it.LocalNameProvenanceIT', 'params/params-fixture.dex'],
    namingCoverageIT: ['dev.workbench.it.NamingCoverageIT', 'params/params-fixture.dex'],
    smaliWindowIT: ['dev.workbench.it.SmaliWindowIT', 'params/params-fixture.dex'],
    generatedLocalIT: ['dev.workbench.it.GeneratedLocalIT', 'params/params-fixture.dex'],
    renameFamilyIT: ['dev.workbench.it.RenameFamilyIT', 'rename-family/rename-family.dex'],
    callSiteCalleeIT: ['dev.workbench.it.CallSiteCalleeIT', 'rename-family/rename-family.dex'],
    variableRenderingIT: ['dev.workbench.it.VariableRenderingIT', 'rename-family/rename-family.dex'],
    unchangedRenameIT: ['dev.workbench.it.UnchangedRenameIT', 'params/params-fixture.dex'],
].each { taskName, fixture ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = 'Native JEB rename ownership and save/reopen checks on an authored fixture'
        classpath = sourceSets.test.runtimeClasspath
        mainClass = fixture[0]
        workingDir = repoRoot
        dependsOn 'compileTestJava'
        environment 'WORKBENCH_MOCK', '0'
        environment 'WORKBENCH_COURSE', '0'
        if (taskName in ['onDemandSearchIT','generatedLocalIT','unchangedRenameIT']) environment 'WORKBENCH_INDEX_MODE', 'on-demand'
        environment 'WORKBENCH_REVIEW_MODE', 'auto'
        if (hasEngine) {
            classpath += engineJars
            jvmArgs jebJvmArgs.findAll { !it.startsWith('-Djava.io.tmpdir=') }
        }
        doFirst {
            if (!hasEngine) throw new GradleException('This native fixture needs an activated JEB_HOME')
            def parent = new File(buildDir, 'tmp/' + taskName)
            parent.mkdirs()
            def run = java.nio.file.Files.createTempDirectory(parent.toPath(), 'run-').toFile()
            new File(run, 'java-home').mkdirs()
            new File(run, 'tmp').mkdirs()
            systemProperty 'user.home', new File(run, 'java-home').absolutePath
            systemProperty 'java.io.tmpdir', new File(run, 'tmp').absolutePath
            environment 'WORKBENCH_HOME', new File(run, 'home').absolutePath
            args file('src/test/fixtures/' + fixture[1]).absolutePath, run.absolutePath
            if (taskName == 'renameCollisionIT') args file('src/test/fixtures/name-collision/name-collision.dex').absolutePath
            if (taskName == 'unchangedRenameIT') args file('src/test/fixtures/rename-family/rename-family.dex').absolutePath
        }
    }
}

