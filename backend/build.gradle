plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// build-info.properties on the runtime classpath: WHICH compiled classes are live (a source Git SHA alone does
// not say — the WhatsApp path investigation ran an unrebuilt runtime, 2026-10-09). Deterministic on a clean tree
// (the commit's date), wall-clock only when the tree is dirty — the packaged jar stays byte-stable per commit.
// written INTO the classes dir: the one directory every classpath has (gradle, workbench.sh's -cp, the package's
// jar) — after compileJava, so a clean recompile never leaves the file behind
def buildInfoDir = file("${buildDir}/classes/java/main")
tasks.register('buildInfo') {
    outputs.upToDateWhen { false }
    mustRunAfter 'compileJava'
    doLast {
        def sha = 'unknown', dirty = 'unknown', at = java.time.Instant.now().toString(), basis = 'wall clock'
        def sourcePin = 'unknown'
        try {
            def root = rootProject.projectDir.parentFile   // the REPO root: the pathspecs below are repo-relative (this project is backend/)
            def run = { List<String> cmd -> def pr = cmd.execute(null, root); def out = pr.text.trim(); pr.waitFor(); if (pr.exitValue() != 0) throw new RuntimeException("git failed: " + cmd); out }
            sha = run(['git', 'rev-parse', 'HEAD'])
            // modified tracked files, or UNTRACKED sources (a new .java is a different build), under the source trees
            def porcelain = run(['git', 'status', '--porcelain', '--untracked-files=all', '--', 'backend/src', 'backend/runs', 'backend/build.gradle', 'web/src', 'mcp', 'deploy'])
            dirty = porcelain.isEmpty() ? 'false' : 'true'
            if (porcelain.isEmpty()) { at = run(['git', 'log', '-1', '--format=%cI', 'HEAD']); basis = 'the commit date (clean tree)' }
        } catch (Exception ignored) {}
        buildInfoDir.mkdirs()
        new File(buildInfoDir, 'build-info.properties').text = "git.sha=${sha}\ngit.dirty=${dirty}\nbuilt.at=${at}\nbuilt.at.basis=${basis}\nsource.inputs.sha256=${sourcePin}\n"
    }
}
classes.dependsOn 'buildInfo'

// No external dependencies: JDK's com.sun.net.httpserver only, like old Jeeves.
// JEB (JEB_HOME, or a copy of an install under backend/engine) is compileOnly + added to
// run classpaths when present; without it the jeb adapter package is excluded and the
// backend builds/runs mock-only.

def engineDir = file(System.getenv('JEB_HOME') ?: "${rootProject.projectDir}/engine")
def engineJars = fileTree(dir: "$engineDir/bin/app", include: '*.jar')
def hasEngine = new File(engineDir, 'bin/app/jeb.jar').isFile()
if (System.getenv('JEB_HOME') && !hasEngine) {
    throw new GradleException('Explicit JEB_HOME has no bin/app/jeb.jar: ' + engineDir)
}

def jadxDir = file(System.getenv('JADX_HOME') ?: "${rootProject.projectDir}/jadx")
def jadxLibDir = new File(jadxDir, 'lib').isDirectory() ? new File(jadxDir, 'lib') : jadxDir
def jadxJars = fileTree(dir: jadxLibDir, include: '*.jar')
def hasJadx = jadxLibDir.isDirectory() && jadxLibDir.listFiles({ d, n ->
    (n.startsWith('jadx-core') || (n.startsWith('jadx-') && n.endsWith('-all.jar'))) && n.endsWith('.jar')
} as FilenameFilter)
if (System.getenv('JADX_HOME') && !hasJadx) {
    throw new GradleException('Explicit JADX_HOME has no jadx-*-all.jar or jadx-core*.jar in lib/ or root: ' + jadxDir)
}

if (hasEngine) {
    dependencies {
        compileOnly engineJars
        testCompileOnly engineJars   // KeysIT makes databases through the published API
    }
} else {
    sourceSets.main.java.exclude 'dev/workbench/engine/jeb/**'
    sourceSets.test.java.exclude 'dev/workbench/it/**'
    logger.lifecycle('NOTE: no JEB install (JEB_HOME unset, backend/engine absent) — excluding jeb package')
}

if (hasJadx) {
    dependencies {
        compileOnly jadxJars
        runtimeOnly jadxJars
        testCompileOnly jadxJars
        testRuntimeOnly jadxJars
    }
} else {
    sourceSets.main.java.exclude 'dev/workbench/engine/jadx/**'
    sourceSets.test.java.exclude 'dev/workbench/engine/jadx/**'
}

