// Local filesystem/journal invariants; no SDK, network, server or model required.
[
    persistenceTest: 'dev.workbench.persistence.PersistenceTest',
    historyJournalTest: 'dev.workbench.persistence.HistoryJournalTest',
    workspacePersistenceTest: 'dev.workbench.persistence.WorkspacePersistenceTest',
    engineProviderContractTest: 'dev.workbench.engine.EngineProviderContractTest',
].each { taskName, entryPoint ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = 'Filesystem save recovery and durable history journal checks'
        environment 'WORKBENCH_MOCK', '1'
        environment 'WORKBENCH_COURSE', '0'
        classpath = sourceSets.test.runtimeClasspath
        mainClass = entryPoint
        workingDir = repoRoot
        dependsOn 'compileTestJava'
    }
}

