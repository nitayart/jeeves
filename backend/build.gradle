// LLM config IT: the provider/model configuration contract (llm-config design §9) — the
// create gate + slug precedence, the explicit default, built-in labels, write-only keys,
// the UNLISTED pin, rename (config/key/pins, position, refusals, custom, env on both ids),
// remove ordering, persistence through fresh stores, persist failures (E_IO, the rename
// undo), and the configure/rename + setkey/rename races
// (see src/test/java/dev/workbench/it/LlmConfigIT.java). Hermetic: its own home + port;
// the IT refuses to run without WORKBENCH_HOME so it can never touch the user's keys.
tasks.register('llmConfigIT', JavaExec) {
    group = 'verification'
    description = 'LLM config IT: provider/model configuration — create gate, defaults, keys, unlisted pins, rename, persistence, failures, races'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.workbench.it.LlmConfigIT'
    workingDir = repoRoot
    dependsOn 'compileTestJava'
    def llmcfgHome = new File(buildDir, 'tmp/llmconfigit-home')
    doFirst { delete(llmcfgHome); llmcfgHome.mkdirs() }
    environment 'WORKBENCH_HOME', llmcfgHome.absolutePath
    environment 'WORKBENCH_PORT', '7815'   // never collide with the interactive server on 7800
    environment 'WORKBENCH_LLM_LLMCFGIT_ENV_KEY', 'env-value-llmcfgit'   // the env-precedence seam (design §9)
    if (hasEngine) {
        classpath += engineJars
        jvmArgs jebJvmArgs
    }
}

